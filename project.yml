name: SwiftIDE
options:
  bundleIdPrefix: com.swiftide
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  SwiftIDE:
    type: application
    platform: iOS
    sources:
      - path: SwiftIDE
        excludes:
          - "**/*.plist"
    settings:
      base:
        INFOPLIST_FILE: SwiftIDE/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.swiftide.app
        PRODUCT_NAME: SwiftIDE
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: false
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: true
    info:
      path: SwiftIDE/Resources/Info.plist
