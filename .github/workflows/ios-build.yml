name: iOS Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep -i xcode || true
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          else
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version
          xcodebuild -showsdks

      - name: Show available schemes and destinations
        run: |
          xcodebuild -list -project SwiftIDE.xcodeproj
          echo "---"
          xcodebuild -showdestinations -project SwiftIDE.xcodeproj -scheme SwiftIDE || true

      - name: Build for Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwiftIDE.xcodeproj \
            -scheme SwiftIDE \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | tee build-sim.log

      - name: Archive (Release) for device
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwiftIDE.xcodeproj \
            -scheme SwiftIDE \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SwiftIDE.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | tee build-archive.log

      - name: Package IPA
        run: |
          set -e
          if [ ! -d "build/SwiftIDE.xcarchive/Products/Applications/SwiftIDE.app" ]; then
            echo "ERROR: .app not found in archive"
            find build -type d -name "*.app" || true
            ls -laR build || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R build/SwiftIDE.xcarchive/Products/Applications/SwiftIDE.app build/Payload/
          cd build
          zip -r SwiftIDE.ipa Payload
          ls -lh SwiftIDE.ipa
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftIDE-iOS-${{ github.ref_name }}
          path: build/SwiftIDE.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-sim.log
            build-archive.log
            build/
          retention-days: 7
