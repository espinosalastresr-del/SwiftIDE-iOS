name: iOS Build & Test

on:
  push:
    branches: [ main, 'feature/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          echo "Available Xcodes:"
          ls /Applications | grep -i xcode || true

          # Prefer versions that usually ship with matching simulator runtimes on GH runners
          for candidate in \
            "/Applications/Xcode_16.4.app" \
            "/Applications/Xcode_16.3.app" \
            "/Applications/Xcode_16.2.app" \
            "/Applications/Xcode_16.1.app" \
            "/Applications/Xcode_16.0.app" \
            "/Applications/Xcode_26.3.app" \
            "/Applications/Xcode_26.2.app" \
            "/Applications/Xcode_26.1.app" \
            "/Applications/Xcode_26.0.app" \
            "/Applications/Xcode.app"
          do
            if [ -d "$candidate" ]; then
              echo "Selecting $candidate"
              sudo xcode-select -s "$candidate/Contents/Developer"
              break
            fi
          done

          xcodebuild -version
          echo "Installed SDKs:"
          xcodebuild -showsdks || true
          echo "Simulators:"
          xcrun simctl list devices available || true

      - name: Install XcodeGen
        run: |
          brew install xcodegen || true
          which xcodegen
          xcodegen --version

      - name: Generate Xcode project with XcodeGen
        run: |
          rm -rf SwiftIDE.xcodeproj
          xcodegen generate --spec project.yml
          echo "Generated project:"
          ls -la SwiftIDE.xcodeproj/
          xcodebuild -list -project SwiftIDE.xcodeproj

      - name: Resolve build destination
        id: dest
        run: |
          # Try generic simulator first; fall back to first available iPhone simulator name
          if xcodebuild -showdestinations -project SwiftIDE.xcodeproj -scheme SwiftIDE 2>/dev/null | grep -q "platform:iOS Simulator"; then
            DEST='generic/platform=iOS Simulator'
          else
            NAME=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/' || true)
            if [ -n "$NAME" ]; then
              DEST="platform=iOS Simulator,id=$NAME"
            else
              DEST='generic/platform=iOS'
            fi
          fi
          echo "Using destination: $DEST"
          echo "destination=$DEST" >> "$GITHUB_OUTPUT"

      - name: Build for Simulator (Debug)
        run: |
          set -o pipefail
          xcodebuild build \
            -project SwiftIDE.xcodeproj \
            -scheme SwiftIDE \
            -destination "${{ steps.dest.outputs.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            2>&1 | tee build-sim.log

      - name: Archive (Release) for device
        run: |
          set -o pipefail
          xcodebuild archive \
            -project SwiftIDE.xcodeproj \
            -scheme SwiftIDE \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/SwiftIDE.xcarchive \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            2>&1 | tee build-archive.log

      - name: Package IPA
        run: |
          set -e
          APP_PATH="build/SwiftIDE.xcarchive/Products/Applications/SwiftIDE.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: .app not found in archive"
            find build -type d -name "*.app" || true
            ls -laR build || true
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -r SwiftIDE.ipa Payload
          ls -lh SwiftIDE.ipa
          echo "IPA created successfully"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftIDE-iOS-${{ github.ref_name }}
          path: build/SwiftIDE.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-sim.log
            build-archive.log
            build/
          retention-days: 7
